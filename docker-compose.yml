version: "3.8"

services:
  # 1. 你的 FastAPI 服务
  my-monitor-app:
    build: .
    container_name: my-monitor-app
    ports:
      - "8000:8000"

  # 2. Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # 3. Grafana 大屏
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
